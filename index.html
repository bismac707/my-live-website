<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitPush Pro | Command Builder & Terminal Simulator</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --panel-bg: #161b22;
      --border-color: #30363d;
      --accent-green: #2ea44f;
      --accent-blue: #58a6ff;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --term-bg: #011627;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--panel-bg);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      padding: 2rem;
      flex: 1;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .card h2 {
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      color: var(--text-main);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    input, select {
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      outline: 1px solid var(--accent-blue);
    }

    .checkbox-group {
      display: flex;
      gap: 1rem;
      align-items: center;
      font-size: 0.85rem;
    }

    .checkbox-group input {
      cursor: pointer;
    }

    .command-preview {
      background-color: var(--term-bg);
      padding: 1rem;
      border-radius: 4px;
      font-family: "Courier New", Courier, monospace;
      color: #addb67;
      display: flex;
      justify-content: space-between;
      align-items: center;
      word-break: break-all;
    }

    .btn {
      background-color: var(--accent-green);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #2c974b;
    }

    .btn-secondary {
      background-color: #21262d;
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
    }

    .btn-secondary:hover {
      background-color: #30363d;
    }

    /* Terminal Styles */
    .terminal-container {
      background-color: var(--term-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
    }

    .terminal-header {
      background-color: #010e1a;
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .dot-red { background-color: #ff5f56; }
    .dot-yellow { background-color: #ffbd2e; }
    .dot-green { background-color: #27c93f; }

    .terminal-body {
      padding: 1rem;
      flex: 1;
      min-height: 250px;
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .term-line {
      line-height: 1.4;
    }

    .term-prompt {
      color: var(--accent-blue);
    }

    .term-success {
      color: #addb67;
    }

    .term-info {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1><span>&gt;_</span> GitPush Pro</h1>
    <span style="font-size: 0.85rem; color: var(--text-muted);">Interactive Command Builder</span>
  </header>

  <div class="container">
    <!-- Configuration Panel -->
    <div class="card">
      <h2>Configure Git Push Action</h2>
      
      <div class="form-group">
        <label for="remote">Remote Name</label>
        <input type="text" id="remote" value="origin" placeholder="e.g. origin">
      </div>

      <div class="form-group">
        <label for="branch">Target Branch</label>
        <input type="text" id="branch" value="main" placeholder="e.g. main, feature/login">
      </div>

      <div class="form-group">
        <label for="actionType">Command Type</label>
        <select id="actionType" onchange="updateCommand()">
          <option value="standard">Standard Push</option>
          <option value="setUpstream">Push & Set Upstream (-u)</option>
          <option value="force">Force Push (--force-with-lease)</option>
          <option value="tags">Push All Tags (--tags)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Options</label>
        <div class="checkbox-group">
          <label><input type="checkbox" id="optTags" onchange="updateCommand()"> Include Tags</label>
          <label><input type="checkbox" id="optDryRun" onchange="updateCommand()"> Dry Run (--dry-run)</label>
        </div>
      </div>

      <div class="form-group">
        <label>Generated Command</label>
        <div class="command-preview">
          <span id="cmdOutput">git push origin main</span>
          <button class="btn btn-secondary" onclick="copyCommand()">Copy</button>
        </div>
      </div>

      <button class="btn" onclick="simulatePush()">Run Command in Simulator</button>
    </div>

    <!-- Terminal Simulator -->
    <div class="terminal-container">
      <div class="terminal-header">
        <div class="dot dot-red"></div>
        <div class="dot dot-yellow"></div>
        <div class="dot dot-green"></div>
        <span style="margin-left: 0.5rem; font-size: 0.75rem; color: var(--text-muted);">bash - 80x24</span>
      </div>
      <div class="terminal-body" id="terminal">
        <div class="term-line term-info">GitPush Pro Simulator v1.0.0</div>
        <div class="term-line term-info">Type or construct a command above and click 'Run'.</div>
      </div>
    </div>
  </div>

  <script>
    function updateCommand() {
      const remote = document.getElementById('remote').value.trim() || 'origin';
      const branch = document.getElementById('branch').value.trim() || 'main';
      const actionType = document.getElementById('actionType').value;
      const optTags = document.getElementById('optTags').checked;
      const optDryRun = document.getElementById('optDryRun').checked;

      let parts = ['git', 'push'];

      if (actionType === 'setUpstream') parts.push('-u');
      if (actionType === 'force') parts.push('--force-with-lease');
      if (actionType === 'tags') parts.push('--tags');

      if (optDryRun) parts.push('--dry-run');
      if (optTags && actionType !== 'tags') parts.push('--follow-tags');

      parts.push(remote);
      parts.push(branch);

      document.getElementById('cmdOutput').textContent = parts.join(' ');
    }

    document.getElementById('remote').addEventListener('input', updateCommand);
    document.getElementById('branch').addEventListener('input', updateCommand);

    function copyCommand() {
      const cmd = document.getElementById('cmdOutput').textContent;
      navigator.clipboard.writeText(cmd);
      alert('Command copied to clipboard!');
    }

    function simulatePush() {
      const cmd = document.getElementById('cmdOutput').textContent;
      const term = document.getElementById('terminal');

      const cmdLine = document.createElement('div');
      cmdLine.className = 'term-line';
      cmdLine.innerHTML = `<span class="term-prompt">user@dev-machine:~$</span> ${cmd}`;
      term.appendChild(cmdLine);

      const responseLine = document.createElement('div');
      responseLine.className = 'term-line term-info';
      responseLine.textContent = 'Enumerating objects: 5, done.\nCounting objects: 100% (5/5), done.';
      term.appendChild(responseLine);

      setTimeout(() => {
        const successLine = document.createElement('div');
        successLine.className = 'term-line term-success';
        successLine.textContent = `To github.com:example/repo.git\n * [new branch]      ${document.getElementById('branch').value || 'main'} -> ${document.getElementById('branch').value || 'main'}`;
        term.appendChild(successLine);
        term.scrollTop = term.scrollHeight;
      }, 600);

      term.scrollTop = term.scrollHeight;
    }
  </script>
</body>
</html>
